<app-header2></app-header2>

<!-- Contenedor principal que incluye el menú lateral y el contenido de egresos -->
<div style="display: flex">
  <!-- Componente de menú lateral -->
  <aside class="sidebar">
    <div class="user-info">
      <h2>Bienvenido</h2>
      <p>[Nombre de usuario]</p>
    </div>
    <ul class="menu">
      <li><a routerLink="/principal" routerLinkActive="active"><i class="fas fa-tachometer-alt"></i>
          Panel Principal</a></li>
      <li><a routerLink="/empresa"><i class="fas fa-building"></i> Empresa</a></li>
      <li><a routerLink="/ingresos"><i class="fas fa-chart-line"></i> Ingresos</a></li>
      <li><a routerLink="/egresos"><i class="fas fa-arrow-circle-down"></i> Egresos</a></li>
      <li><a routerLink="/"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</a></li>
    </ul>
  </aside>

  <div class="container">
    <h1>Análisis Financiero</h1>
    
    <!-- Sección inicial - Botón Generar Análisis -->
    <div *ngIf="!iniciado && !cargando && !diagnostico" class="inicio-section">
      <p>Presione el botón para generar un análisis financiero de su empresa</p>
      <button (click)="iniciarAnalisis()" class="btn-generar">
        <i class="fas fa-chart-pie"></i> Generar Análisis
      </button>
    </div>

    <!-- Estado de carga -->
    <div *ngIf="cargando" class="loading">
      <div class="spinner-container">
        <div class="spinner"></div>
        <p>Analizando datos financieros...</p>
      </div>
    </div>

    <!-- Mensaje de error -->
    <div *ngIf="error" class="error">
      <i class="fas fa-exclamation-triangle"></i>
      <p>{{ error }}</p>
      <button (click)="obtenerDiagnostico()" class="btn-reintentar">
        <i class="fas fa-sync-alt"></i> Reintentar
      </button>
    </div>

    <!-- Resultado del análisis -->
    <div *ngIf="diagnostico && !cargando" class="resultado">
      <div class="resultado-header">
        <h2><i class="fas fa-file-alt"></i> Diagnóstico Financiero</h2>
        <button (click)="iniciarAnalisis()" class="btn-actualizar">
          <i class="fas fa-redo"></i> Actualizar Análisis
        </button>
      </div>
      <div class="diagnostico-texto">
        {{ diagnostico }}
      </div>
    </div>
  </div>
</div>

<app-footer2></app-footer2>
