
<div class="container">
  <h1>Análisis Financiero</h1>
  
  <div *ngIf="cargando" class="loading">
    <p>Analizando datos financieros...</p>
    <div class="spinner"></div>
  </div>

  <div *ngIf="error" class="error">
    <p>{{ error }}</p>
    <button (click)="obtenerDiagnostico()">Reintentar</button>
  </div>

  <div *ngIf="diagnostico && !cargando" class="resultado">
    <h2>Diagnóstico:</h2>
    <div class="diagnostico-texto">
      {{ diagnostico }}
    </div>
    <button (click)="obtenerDiagnostico()">Actualizar Análisis</button>
  </div>
</div>
